<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>小展AI</title>
<style>
/* ===== 全局 ===== */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --pri:#7c3aed;--pri2:#5b21d9;
  --bg:#0a0a1a;--card:#1c1c40;--card2:#252550;
  --fg:#e8e8f0;--fg2:#a0a0c0;--border:#2a2a4a;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--fg);
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  transition:background .3s,color .3s;
}

/* ===== 顶部栏 ===== */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;
  background:rgba(18,18,42,0.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  flex-shrink:0;z-index:100;
}
.menu-btn{
  width:40px;height:40px;border-radius:10px;
  background:var(--card);border:1px solid var(--border);
  color:var(--fg);font-size:22px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;z-index:101;
}
.menu-btn:active{background:rgba(124,58,237,0.2)}
.topbar h1{
  font-size:17px;font-weight:700;flex:1;
  text-align:center;color:var(--fg);
}
.right-btn{
  width:40px;height:40px;border-radius:10px;
  background:transparent;border:none;
  color:var(--fg2);font-size:20px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
}

/* ===== 侧边栏 ===== */
.sidebar{
  position:fixed;top:0;left:0;bottom:0;
  width:280px;background:#12122a;
  border-right:1px solid var(--border);
  z-index:9999;
  transform:translateX(-100%);
  transition:transform 0.3s ease;
  display:flex;flex-direction:column;
}
.sidebar.open{transform:translateX(0)}
.sidebar-overlay{
  position:fixed;inset:0;z-index:9998;
  background:rgba(0,0,0,0.5);
  opacity:0;pointer-events:none;
  transition:opacity 0.3s;
}
.sidebar-overlay.show{opacity:1;pointer-events:auto}

.sidebar-header{padding:16px;border-bottom:1px solid var(--border);}
.sidebar-header h2{font-size:15px;color:var(--fg2);font-weight:500}
.sidebar-tabs{display:flex;gap:8px;margin-top:10px}
.tab-btn{
  flex:1;padding:10px 6px;border-radius:8px;
  background:var(--card);border:1px solid var(--border);
  color:var(--fg);font-size:14px;font-weight:600;
  cursor:pointer;text-align:center;
  user-select:none;-webkit-user-select:none;
  transition:background .2s,color .2s;
  position:relative;z-index:2;
}
.tab-btn:hover{background:rgba(124,58,237,0.15)}
.tab-btn.active{background:var(--pri);border-color:var(--pri);color:#fff}
.tab-btn:active{transform:scale(0.96)}

.new-chat-btn{
  margin:12px 16px;padding:12px;
  border-radius:12px;border:none;
  background:linear-gradient(135deg,var(--pri),var(--pri2));
  color:#fff;font-weight:700;font-size:15px;
  cursor:pointer;
}
.new-chat-btn:active{transform:scale(0.97)}

.chat-list{flex:1;overflow-y:auto;padding:0 8px 16px}
.chat-list::-webkit-scrollbar{width:4px}
.chat-list::-webkit-scrollbar-thumb{background:rgba(124,58,237,0.3);border-radius:2px}
.chat-item{
  display:flex;align-items:center;gap:6px;
  padding:10px 8px;border-radius:10px;
  cursor:pointer;font-size:14px;color:var(--fg);
  margin-bottom:4px;position:relative;
  user-select:none;-webkit-user-select:none;
}
.chat-item:active{background:rgba(124,58,237,0.15)}
.chat-item.active{background:rgba(124,58,237,0.2);color:#fff}
.chat-item.pinned{border-left:3px solid #eab308;padding-left:6px}
.chat-item .star{font-size:14px;cursor:pointer;flex-shrink:0;padding:2px 4px;opacity:0.5}
.chat-item .star:hover,.chat-item .star:active{opacity:1}
.chat-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.chat-item .del{
  font-size:13px;color:#ff6b6b;cursor:pointer;
  padding:4px 8px;border-radius:6px;
  background:rgba(255,107,107,0.12);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
}
.chat-item .del:hover,.chat-item .del:active{background:rgba(255,107,107,0.3)}

/* 主题区 */
.theme-section{padding:14px 16px;border-top:1px solid var(--border)}
.theme-section h3{font-size:13px;color:var(--fg2);margin-bottom:10px;font-weight:500}
.theme-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.theme-dot{
  width:30px;height:30px;border-radius:50%;
  border:2px solid var(--border);cursor:pointer;
}
.theme-dot.active{border-color:#fff;box-shadow:0 0 6px rgba(255,255,255,0.3)}
.theme-dot:hover{transform:scale(1.1)}
.theme-dot:active{transform:scale(0.9)}

/* ===== 视图容器 ===== */
#chatView{display:flex;flex:1;flex-direction:column;overflow:hidden}
#genView{display:none;flex:1;flex-direction:column;overflow:hidden}
#callView{display:none;flex:1;flex-direction:column;overflow:hidden}

/* ===== 聊天区 ===== */
main{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
main::-webkit-scrollbar{width:4px}
main::-webkit-scrollbar-thumb{background:rgba(124,58,237,0.3);border-radius:2px}

.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
.empty-emoji{font-size:52px}
.empty-title{font-size:19px;font-weight:700;color:var(--fg)}
.empty-sub{font-size:13px;color:var(--fg2);max-width:260px;line-height:1.7}

/* 消息 */
.msg{display:flex;flex-direction:column;gap:2px;max-width:88%;position:relative}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.ai{align-self:flex-start;align-items:flex-start}
.bubble{
  padding:10px 14px;border-radius:16px;
  word-wrap:break-word;overflow-wrap:anywhere;
  line-height:1.55;font-size:14.5px;
  animation:fade .25s ease;white-space:pre-wrap;
}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.bubble.user{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-bottom-right-radius:5px}
.bubble.ai{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:5px;color:var(--fg)}
.msg-time{font-size:10px;color:var(--fg2);opacity:0.6;padding:0 4px}

/* 消息删除按钮 */
.del-btn{
  position:absolute;top:-8px;
  width:20px;height:20px;
  border-radius:50%;border:none;background:#ef4444;
  color:#fff;font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  z-index:10;box-shadow:0 1px 4px rgba(0,0,0,0.3);
}
.msg.user .del-btn{right:-8px}
.msg.ai .del-btn{left:-8px}
.del-btn:hover{transform:scale(1.1)}
.del-btn:active{transform:scale(0.9)}

/* 朗读按钮 */
.tts-btn{
  position:absolute;bottom:-8px;
  width:22px;height:22px;
  border-radius:50%;border:none;background:var(--pri);
  color:#fff;font-size:11px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  z-index:10;
}
.msg.ai .tts-btn{right:-10px}
.tts-btn:hover{transform:scale(1.1)}
.tts-btn:active{transform:scale(0.9)}

/* 打字动画 */
.typing{display:inline-flex;gap:3px;padding:2px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--pri);opacity:0.4;animation:typing 1.4s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:0.2s}
.typing span:nth-child(3){animation-delay:0.4s}
@keyframes typing{0%,60%,100%{opacity:0.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* 思考文字 */
.thinking{color:var(--fg2);font-size:13px;display:flex;align-items:center;gap:6px}

/* ===== 输入区 ===== */
.input-wrap{
  padding:10px 12px;
  background:rgba(18,18,42,0.9);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  flex-shrink:0;
}
.input-row{display:flex;gap:8px;align-items:flex-end}

/* 发送按钮在左侧 */
.send-btn{
  height:44px;min-width:60px;padding:0 18px;
  border:none;border-radius:22px;
  background:linear-gradient(135deg,var(--pri),var(--pri2));
  color:#fff;font-weight:700;font-size:15px;
  cursor:pointer;flex-shrink:0;
  -webkit-appearance:none;appearance:none;
  pointer-events:auto;
  order:-1;
  z-index:99999;
}
.send-btn:hover{opacity:0.9}
.send-btn:active{opacity:0.8;transform:scale(0.95)}

.mic-btn{
  width:44px;height:44px;border-radius:22px;
  background:var(--card);border:1px solid var(--border);
  color:var(--fg);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.mic-btn:hover{background:rgba(124,58,237,0.15)}
.mic-btn.recording{background:#ef4444;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}

#textInput{
  flex:1;min-height:44px;max-height:100px;
  padding:12px 16px;border-radius:22px;
  border:1px solid var(--border);background:var(--card);
  color:var(--fg);font-size:15px;line-height:1.4;
  resize:none;overflow-y:auto;outline:none;font-family:inherit;
}
#textInput::placeholder{color:var(--fg2);opacity:0.5}
#textInput:focus{border-color:rgba(124,58,237,0.5);box-shadow:0 0 0 3px rgba(124,58,237,0.1)}

/* 录音提示条 */
.recording-bar{
  display:none;align-items:center;gap:8px;
  padding:6px 12px;margin-bottom:8px;
  background:#2a1a1a;border:1px solid #5a2020;border-radius:10px;
  font-size:13px;color:#ff8888;
}
.recording-bar.show{display:flex}
.recording-bar .dot{width:8px;height:8px;border-radius:50%;background:#ef4444;animation:pulse 1s infinite}

/* ===== 设置弹窗 ===== */
#settingsModal{
  display:none;position:fixed;inset:0;z-index:99999;
  background:rgba(0,0,0,0.7);
  align-items:center;justify-content:center;padding:20px;
}
#settingsModal.show{display:flex}
.settings-panel{
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  width:100%;max-width:340px;padding:20px;
  display:flex;flex-direction:column;gap:12px;
}
.settings-panel h2{font-size:17px;color:var(--fg);margin:0 0 4px}
.settings-panel label{font-size:13px;color:var(--fg2);display:block;margin-bottom:4px}
.settings-panel select,.settings-panel textarea,.settings-panel input[type=text]{
  width:100%;padding:10px 12px;border-radius:10px;
  border:1px solid var(--border);background:#12122a;
  color:var(--fg);font-size:14px;outline:none;font-family:inherit;
}
.settings-panel textarea{resize:vertical;min-height:60px}
.settings-panel .row{display:flex;align-items:center;gap:8px}
.settings-panel .row label{margin:0;font-size:14px;color:var(--fg)}
.settings-panel .close-btn{
  margin-top:6px;padding:12px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--pri),var(--pri2));
  color:#fff;font-weight:700;font-size:15px;cursor:pointer;
}
.settings-panel .close-btn:hover{opacity:0.9}
.role-presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.role-chip{
  padding:5px 12px;border-radius:14px;
  background:#12122a;border:1px solid var(--border);
  color:var(--fg2);font-size:12px;cursor:pointer;
  user-select:none;-webkit-user-select:none;
}
.role-chip:hover{background:rgba(124,58,237,0.2);color:var(--fg)}
.role-chip:active{background:rgba(124,58,237,0.3);color:#fff}

/* ===== 确认弹窗 ===== */
#confirmModal{
  display:none;position:fixed;inset:0;z-index:99999;
  background:rgba(0,0,0,0.6);
  align-items:center;justify-content:center;padding:20px;
}
#confirmModal.show{display:flex}
.confirm-box{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  width:100%;max-width:300px;padding:24px 20px;
  display:flex;flex-direction:column;gap:16px;
  animation:pop .2s ease;
}
@keyframes pop{from{transform:scale(0.9);opacity:0}to{transform:scale(1);opacity:1}}
.confirm-box .icon{font-size:36px;text-align:center}
.confirm-box p{font-size:15px;color:var(--fg);text-align:center;line-height:1.6}
.confirm-btns{display:flex;gap:10px}
.confirm-btns button{
  flex:1;padding:11px;border-radius:10px;
  font-size:14px;font-weight:600;cursor:pointer;border:none;
}
.btn-cancel{background:var(--border);color:var(--fg)}
.btn-cancel:hover{background:#3a3a5a}
.btn-cancel:active{background:#3a3a5a}
.btn-delete{background:#ef4444;color:#fff}
.btn-delete:hover{background:#dc2626}
.btn-delete:active{background:#dc2626}

/* ===== Toast ===== */
.toast{
  position:fixed;bottom:80px;left:50%;z-index:99999;
  transform:translateX(-50%) translateY(20px);
  padding:10px 20px;background:var(--card2);border:1px solid var(--border);
  border-radius:10px;font-size:13px;color:var(--fg);
  opacity:0;pointer-events:none;transition:all 0.3s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== 生图界面 ===== */
.gen-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.gen-body::-webkit-scrollbar{width:4px}
.gen-body::-webkit-scrollbar-thumb{background:rgba(124,58,237,0.3);border-radius:2px}

.gen-input-area{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:12px;display:flex;flex-direction:column;gap:10px;
}
.gen-input-area textarea{
  width:100%;min-height:70px;padding:10px;
  border-radius:10px;border:1px solid var(--border);
  background:#12122a;color:var(--fg);font-size:14px;
  resize:vertical;outline:none;font-family:inherit;
}
.gen-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gen-row label{font-size:12px;color:var(--fg2);white-space:nowrap}
.gen-row select{
  padding:6px 10px;border-radius:8px;
  border:1px solid var(--border);background:#12122a;
  color:var(--fg);font-size:13px;outline:none;
}
.gen-btn{
  padding:12px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--pri),var(--pri2));
  color:#fff;font-weight:700;font-size:15px;cursor:pointer;
  -webkit-appearance:none;
}
.gen-btn:hover{opacity:0.9}
.gen-btn:active{opacity:0.8}

.gen-progress{
  display:none;flex-direction:column;gap:6px;
  padding:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;
}
.gen-progress.show{display:flex}
.gen-progress .bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.gen-progress .bar .fill{height:100%;width:0%;background:linear-gradient(90deg,var(--pri),#00d4aa);border-radius:2px;transition:width 0.5s}
.gen-progress .status{font-size:13px;color:var(--fg2)}

.gen-result{
  display:none;flex-direction:column;gap:8px;
  padding:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;
}
.gen-result.show{display:flex}
.gen-result img{max-width:100%;border-radius:10px;display:block}
.gen-result .actions{display:flex;gap:8px;flex-wrap:wrap}
.gen-result .actions button{
  padding:8px 14px;border-radius:10px;border:1px solid var(--border);
  background:#12122a;color:var(--fg);font-size:13px;cursor:pointer;
}
.gen-result .actions button:hover{background:rgba(124,58,237,0.2)}

.gen-history{display:none;flex-direction:column;gap:8px}
.gen-history.show{display:flex}
.gen-history h3{font-size:13px;color:var(--fg2);font-weight:500}
.gen-history .thumbs{display:flex;gap:8px;flex-wrap:wrap}
.gen-history .thumb{
  width:60px;height:60px;border-radius:8px;object-fit:cover;
  border:1px solid var(--border);cursor:pointer;
}

/* 风格预设 */
.style-presets{display:flex;flex-wrap:wrap;gap:6px}
.style-chip{
  padding:5px 10px;border-radius:12px;
  background:#12122a;border:1px solid var(--border);
  color:var(--fg2);font-size:12px;cursor:pointer;
  user-select:none;-webkit-user-select:none;
}
.style-chip:hover{background:rgba(124,58,237,0.2)}
.style-chip.active{background:var(--pri);border-color:var(--pri);color:#fff}

/* ===== 电话界面 ===== */
.call-screen{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px;background:linear-gradient(135deg,#1a1a2e,#0f0f1a);
  position:relative;
}
.call-avatar{
  width:120px;height:120px;border-radius:50%;
  background:linear-gradient(135deg,var(--pri),var(--pri2));
  display:flex;align-items:center;justify-content:center;
  font-size:60px;margin-bottom:30px;
  box-shadow:0 0 40px rgba(124,58,237,0.5);
  transition:box-shadow 0.3s;
}
.call-avatar.speaking{box-shadow:0 0 60px rgba(124,58,237,0.8),0 0 100px rgba(0,212,170,0.3)}
.call-avatar.listening{box-shadow:0 0 50px rgba(0,200,255,0.5);animation:pulse 1.5s infinite}
.call-status{font-size:18px;color:var(--fg);margin-bottom:10px;text-align:center;min-height:27px}
.call-wave{display:none;gap:6px;margin-bottom:40px}
.call-wave.show{display:flex}
.call-wave span{width:8px;height:30px;border-radius:4px;background:var(--pri);animation:wave 1.2s ease-in-out infinite}
.call-wave span:nth-child(2){animation-delay:.1s}
.call-wave span:nth-child(3){animation-delay:.2s}
.call-wave span:nth-child(4){animation-delay:.3s}
.call-wave span:nth-child(5){animation-delay:.4s}
@keyframes wave{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}

/* 电话按钮区域 */
.call-btns{display:flex;gap:20px;align-items:center;margin-top:10px}
.call-btn{
  width:70px;height:70px;border-radius:50%;border:none;
  font-size:28px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s,opacity .3s;
}
.call-btn:hover{opacity:0.9}
.call-btn:active{transform:scale(.95)}
.call-btn.hang{background:#ef4444;color:#fff}
.call-btn.listen{
  background:linear-gradient(135deg,var(--pri),var(--pri2));
  color:#fff;
  box-shadow:0 4px 20px rgba(124,58,237,0.4);
}
.call-btn.listen.listening{
  background:linear-gradient(135deg,#00c6ff,#0072ff);
  animation:pulse 1s infinite;
}
.call-btn:disabled{opacity:0.4;cursor:not-allowed}

.call-timer{font-size:14px;color:var(--fg2);margin-top:15px;min-height:20px}
.call-hint{font-size:12px;color:var(--fg2);margin-top:8px;text-align:center;max-width:280px;line-height:1.6}

/* 返回按钮 */
.call-back{
  position:absolute;top:12px;left:14px;
  width:40px;height:40px;border-radius:10px;
  background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);
  color:#fff;font-size:20px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:10;
}
.call-back:hover{background:rgba(255,255,255,0.2)}
.call-back:active{background:rgba(255,255,255,0.3)}
</style>
</head>
<body>

<!-- 侧边栏 -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2>小展AI</h2>
    <div class="sidebar-tabs">
      <div class="tab-btn active" id="tabChat">💬 聊天</div>
      <div class="tab-btn" id="tabGen">🎨 生图</div>
      <div class="tab-btn" id="tabCall">📞 电话</div>
    </div>
  </div>
  <button class="new-chat-btn" id="newChatBtn">＋ 新建对话</button>
  <div class="chat-list" id="chatList"></div>
  <div class="theme-section">
    <h3>🎨 主题色</h3>
    <div class="theme-grid" id="themeGrid"></div>
  </div>
</div>

<!-- 聊天视图 -->
<div id="chatView">
  <div class="topbar">
    <button class="menu-btn" id="menuBtn">☰</button>
    <h1 id="chatTitle">小展AI</h1>
    <button class="right-btn" id="settingsBtn">⚙️</button>
  </div>
  <main id="chat"></main>
  <div class="input-wrap">
    <div class="recording-bar" id="recBar">
      <div class="dot"></div>

// ===== DOM 引用缓存 =====
var $ = function(id){return document.getElementById(id);};

// ===== 初始化 =====
function init(){
  sidebarTab = 'chat';
  try{localStorage.removeItem('xzai_tab');}catch(e){}

  // 加载聊天数据
  try{var s=localStorage.getItem('xzai_chats');if(s) chats=JSON.parse(s);}catch(e){}

  // 加载配置

    var cfg=JSON.parse(localStorage.getItem('xzai_cfg')||'{}');

    selectedVoice=cfg.voice||'';
  }catch(e){}
  // 初始化对话
  var ids=Object.keys(chats);
  if(ids.length){curId=ids[0];}
  else{createChat();}

  // 渲染
  renderChatList();
  renderChat();
  renderStylePresets();
  renderRolePresets();
  initTTS();

  applyTabView();
  bindEvents();

  // 输入框自适应
  var ti=$('textInput');
  ti.addEventListener('input',function(){
    ti.style.height='auto';
    ti.style.height=Math.min(ti.scrollHeight,100)+'px';
  });
  ti.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend();}
  });
  $('genPrompt').addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();startGenerate();}
  });

  // ESC 键
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      closeSettings();
      closeConfirm();
      if(callActive) endCallManually();
      if(sidebarOpen) closeSidebar();
    }
  });

  $('sidebarOverlay').addEventListener('click',closeSidebar);
  $('settingsModal').addEventListener('click',function(e){if(e.target===this) closeSettings();});
}

function bindEvents(){
  $('menuBtn').addEventListener('click',openSidebar);
  $('settingsBtn').addEventListener('click',openSettings);

// ===== 数据存储 =====
function saveChats(){try{localStorage.setItem('xzai_chats',JSON.stringify(chats));}catch(e){}}

// ===== 视图切换 =====
function applyTabView(){

  $('genView').style.display  = sidebarTab==='gen'  ? 'flex' : 'none';
  $('callView').style.display = sidebarTab==='call' ? 'flex' : 'none';

  if(callActive && tab!=='call'){endCallManually();}
  sidebarTab = tab;
  applyTabView();
  closeSidebar();
  if(tab==='call' && !callActive){enterCallView();}
}

// ===== 侧边栏 =====
function openSidebar(){sidebarOpen=true;$('sidebar').classList.add('open');$('sidebarOverlay').classList.add('show');}
function closeSidebar(){sidebarOpen=false;$('sidebar').classList.remove('open');$('sidebarOverlay').classList.remove('show');}

// ===== 主题 =====
function applyTheme(name){
  var t=THEMES[name];if(!t)return;
  var r=document.documentElement;
  r.style.setProperty('--pri',t.pri);r.style.setProperty('--pri2',t.pri2);
  r.style.setProperty('--bg',t.bg);r.style.setProperty('--card',t.card);r.style.setProperty('--card2',t.card2);
  r.style.setProperty('--fg',t.fg);r.style.setProperty('--fg2',t.fg2);r.style.setProperty('--border',t.border);
  localStorage.setItem('xzai_theme',name);
}
function renderThemeDots(active){
  var grid=$('themeGrid');grid.innerHTML='';
  Object.entries(THEMES).forEach(function(entry){
    var name=entry[0],t=entry[1];
    var d=document.createElement('div');
    d.className='theme-dot'+(name===active?' active':'');
    d.style.background='linear-gradient(135deg,'+t.pri+','+t.pri2+')';
    d.addEventListener('click',function(){applyTheme(name);renderThemeDots(name);showToast('🎨 已切换：'+name);});
    grid.appendChild(d);
  });
}

// ===== 对话管理 =====
function createChat(){
  var id='c'+Date.now();
  chats[id]={
    title:'新对话',
    hist:[{role:'system',content:ROLE_PRESETS.default}],
    model:'default',
    pinned:false
  };
  curId=id;saveChats();renderChatList();renderChat();
}
function switchChat(id){curId=id;saveChats();renderChatList();renderChat();closeSidebar();}
function togglePin(id){
  chats[id].pinned=!chats[id].pinned;
  saveChats();renderChatList();
}

function delChat(id){
  var chatTitle=(chats[id]&&chats[id].title)||'这个对话';
  confirmDelete(
    '🗑️ 删除对话',
    '确定要删除「'+chatTitle+'」吗？\n删除后不可恢复。',
    function(){
      delete chats[id];
      var ids=Object.keys(chats);
      if(curId===id) curId=ids[0]||null;
      if(!ids.length) createChat();
      saveChats();renderChatList();renderChat();
      showToast('🗑️ 已删除对话');
    }
  );
}

function renderChatList(){
  var el=$('chatList');el.innerHTML='';
  var ids=Object.keys(chats);
  ids.sort(function(a,b){
    if(chats[a].pinned&&!chats[b].pinned) return -1;
    if(!chats[a].pinned&&chats[b].pinned) return 1;
    return b-a;
  });
  ids.forEach(function(id){
    var c=chats[id];
    var div=document.createElement('div');
    div.className='chat-item'+(id===curId?' active':'')+(c.pinned?' pinned':'');
    div.addEventListener('click',function(){switchChat(id);});

    var star=document.createElement('span');
    star.className='star';
    star.textContent=c.pinned?'⭐':'☆';
    star.addEventListener('click',function(e){e.stopPropagation();togglePin(id);});

    var name=document.createElement('span');
    name.className='name';
    name.textContent=c.title||'新对话';

    var del=document.createElement('span');
    del.className='del';
    del.textContent='🗑 删除';
    del.addEventListener('click',function(e){e.stopPropagation();delChat(id);});

    div.appendChild(star);div.appendChild(name);div.appendChild(del);
    el.appendChild(div);
  });
}

// ===== 渲染聊天 =====
function renderChat(){
  var c=chats[curId];if(!c)return;
  $('chatTitle').textContent=c.title||'新对话';
  var main=$('chat');
  if(c.hist.length<=1){
    main.innerHTML='<div class="empty-state"><div class="empty-emoji">🤖</div><div class="empty-title">你好，我是小展AI</div><div class="empty-sub">零注册 · 零Key · 完全免费<br>开始一段新对话吧</div></div>';
  }else{
    main.innerHTML='';
    c.hist.forEach(function(m,idx){
      if(m.role==='system') return;
      addBubble(m.role==='user'?'user':'ai',m.content,idx,false);
    });
  }
  scrollBottom();
}

// ===== 构建 API 消息列表（包含 system prompt）=====
function buildMessages(hist){
  // 始终包含 system prompt（人格设定），不被过滤掉
  return hist.map(function(m){return {role:m.role,content:m.content};});
}

// ===== 发送消息（修复：system prompt 不丢失）=====
function handleSend(){
  if(sending) return;
  var input=$('textInput');
  var text=input.value.trim();if(!text) return;
  sending=true;

  var c=chats[curId];
  if(c.hist.length===1) $('chat').innerHTML='';

  var userIdx=c.hist.length;
  c.hist.push({role:'user',content:text});
  if(c.title==='新对话'){c.title=text.slice(0,12);$('chatTitle').textContent=c.title;}
  addBubble('user',text,userIdx,true);
  input.value='';input.style.height='auto';

  var aiIdx=c.hist.length;
  c.hist.push({role:'assistant',content:''});
  var aiBubble=addBubble('ai','<div class="thinking"><span class="typing"><span></span><span></span><span></span></span> 正在思考...</div>',aiIdx,false);
  scrollBottom();

  // 修复：buildMessages 包含完整的 system prompt
  fetch('https://api.llm7.io/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:c.model||'default',stream:false,messages:buildMessages(c.hist.slice(0,-1))})
  })
  .then(function(r){
    if(r.status===429){
      return new Promise(function(resolve){
        showToast('⏳ 限流中，稍等...');
        setTimeout(function(){
          fetch('https://api.llm7.io/v1/chat/completions',{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({model:c.model||'default',stream:false,messages:buildMessages(c.hist.slice(0,-1))})
          }).then(resolve);
        },2500);
      });
    }
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  })
  .then(function(d){
    var content=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||'(空回复)';
    c.hist[aiIdx].content=content;
    typewriter(aiBubble,content,0,25);
    if(ttsEnabled) speak(content);
    showToast('✅ 回复完成');
  })

// ===== 中文翻译为英文（用于生图）=====
async function translateToEnglish(text){
  // 如果全是英文/数字/标点，不需要翻译
  if(/^[\x00-\x7F\s\p{P}]+$/u.test(text)) return text;

  try {
    var r = await fetch('https://api.llm7.io/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'fast',
        stream:false,
        messages:[
          {role:'system',content:'You are a translator. Translate the given Chinese text to English. Output ONLY the translation, nothing else. Keep it concise, under 50 words. Do not add quotes or explanations.'},
          {role:'user',content:text}
        ]
      })
    });
    if(r.ok){
      var d = await r.json();
      var translated = d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;
      if(translated && translated.trim()){
        // 清理可能的引号和多余空格
        translated = translated.trim().replace(/^["']|["']$/g,'');
        return translated;
      }
    }
  }catch(e){}
  // 翻译失败就用原文
  return text;
}

async function startGenerate(){
  var promptInput=$('genPrompt').value.trim();
  if(!promptInput){showToast('请输入提示词');return;}

  // 显示翻译中
  showToast('🔄 正在翻译提示词...');

  // 中文自动翻译为英文
  var prompt=await translateToEnglish(promptInput);

  var size=$('genSize').value.split('x');
  var w=parseInt(size[0]),h=parseInt(size[1]);
  var count=parseInt($('genCount').value);
  var model=$('genModel').value;

  var styleObj=STYLE_PRESETS.find(function(s){return s.id===activeStyle;});
  var fullPrompt=prompt+(styleObj&&styleObj.suffix?' '+styleObj.suffix:'');

  // 显示最终使用的英文 prompt
  console.log('[生图] 原始:',promptInput,'→ 翻译后:',prompt,'→ 完整:',fullPrompt);
  showToast('🎨 提示词：'+prompt.slice(0,40));

  var prog=$('genProgress');
  var fill=$('genFill');
  var status=$('genStatus');
  var result=$('genResult');
  prog.classList.add('show');result.classList.remove('show');
  fill.style.width='5%';status.textContent='🎨 正在生成...';

  var pct=5;
  var tick=setInterval(function(){
    pct+=Math.random()*8;if(pct>85)pct=85;
    fill.style.width=pct+'%';
    if(pct>50) status.textContent='正在渲染图像...';
  },400);

  var sources=[
    {name:'ImageFree',url:'https://imagefree.net/api/generate?prompt='+encodeURIComponent(fullPrompt)+'&width='+w+'&height='+h+'&n='+count},
    {name:'Pollinations',url:'https://image.pollinations.ai/prompt/'+encodeURIComponent(fullPrompt)+'?width='+w+'&height='+h+'&model='+(model==='turbo'?'flux-turbo':(model==='sd'?'stable-diffusion':'flux'))},
    {name:'Pollinations2',url:'https://gen.pollinations.ai/v1/images/generate?width='+w+'&height='+h+'&model='+(model==='sd'?'stable-diffusion':(model==='turbo'?'flux-turbo':'flux'))+'&prompt='+encodeURIComponent(fullPrompt)}
  ];

  var tried=0;
  function tryNext(){
    if(tried>=sources.length){
      clearInterval(tick);
      prog.classList.remove('show');
      status.textContent='⚠️ 所有生图源暂不可用，请稍后再试';
      showToast('⚠️ 生图失败，请稍后重试');
      return;
    }
    var src=sources[tried];tried++;
    status.textContent='正在尝试 '+src.name+'...';
    var img=new Image();
    var loaded=false;
    var timeout=setTimeout(function(){if(!loaded){tryNext();}},15000);
    img.onload=function(){
      loaded=true;clearTimeout(timeout);clearInterval(tick);
      fill.style.width='100%';
      status.textContent='✅ 生成完成（'+src.name+'）';
      $('genImg').src=img.src;
      prog.classList.remove('show');result.classList.add('show');
      genHistory.unshift({src:img.src,prompt:promptInput+' → '+prompt});
      if(genHistory.length>6) genHistory.pop();
      renderGenHistory();
      showToast('🎨 生成完成');
    };
    img.onerror=function(){if(!loaded){tryNext();}};
    img.src=src.url;
  }

  setTimeout(function(){
    if(!$('genResult').classList.contains('show')){status.textContent='⏳ 当前使用人数较多，正在排队...';}
  },8000);

  tryNext();
}

// ============================================
// ===== 电话模式（PTT 对讲机模式）=====
// 点击🎤 → 开始录音 → 再点击⏹ → 停止并发送
// 核心原则：每次录音都新建 SpeechRecognition 实例
// （Chrome 规范：stop() 后实例不可复用，必须 new）
// ============================================

var callFinalTranscript='';
var callRecog=null;  // 当前录音实例
var callEndFired=false; // onend 是否已触发

function setCallUIState(state){
  callMode=state;
  var statusEl=$('callStatus');
  var avatarEl=$('callAvatar');
  var listenBtn=$('listenBtn');
  var hangBtn=$('hangBtn');
  var hint=$('callHint');
  var wave=$('callWave');

  avatarEl.className='call-avatar';
  listenBtn.className='call-btn listen';
  wave.classList.remove('show');

  switch(state){
    case 'idle':
      statusEl.textContent='点击「🎤」开始说话';
      listenBtn.textContent='🎤';
      listenBtn.disabled=false;
      hangBtn.style.display='none';
      hint.textContent='点击🎤开始录音 → 再点击⏹结束并发送';
      break;
    case 'listening':
      statusEl.textContent='🎤 录音中...再点⏹结束';
      listenBtn.textContent='⏹ 发送';
      listenBtn.className='call-btn listen listening';
      listenBtn.disabled=false;
      hangBtn.style.display='inline-flex';
      wave.classList.add('show');
      hint.textContent='正在录音，说完再点一次按钮即可发送';
      break;
    case 'processing':
      statusEl.textContent='⏳ 处理识别结果...';
      listenBtn.textContent='⏳';
      listenBtn.disabled=true;
      hangBtn.style.display='inline-flex';
      wave.classList.remove('show');
      hint.textContent='请稍候...';
      break;
    case 'thinking':
      statusEl.textContent='🤔 AI 思考中...';
      listenBtn.textContent='⏳';
      listenBtn.disabled=true;
      hangBtn.style.display='inline-flex';
      hint.textContent='请稍候，AI 正在组织语言...';
      break;
    case 'speaking':
      statusEl.textContent='🔊 AI 正在说话...';
      listenBtn.textContent='⏳';
      listenBtn.disabled=true;
      hangBtn.style.display='inline-flex';
      avatarEl.classList.add('speaking');
      hint.textContent='AI 说完后自动恢复，也可点 ✕ 挂断';
      break;
  }
}

function checkSpeechSupport(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    showToast('⚠️ 浏览器不支持语音识别');
    return null;
  }
  if(!window.isSecureContext){
    var proto=location.protocol;
    if(proto==='file:'){
      showToast('⚠️ 请通过 localhost 或 HTTPS 访问，不能直接双击打开HTML');
    }else{
      showToast('⚠️ 语音识别需要HTTPS，当前是 '+proto);
    }
    return null;
  }
  return SR;
}

function toggleListen(){
  // 如果正在说话，点按钮打断
  if(callIsSpeaking){
    stopCallSpeak();
    return;
  }
  // 如果正在录音，点按钮 → 停止并发送
  if(callIsListening){
    stopAndSend();
    return;
  }
  // 空闲 → 开始录音
  startCallListen();
}

function startCallListen(){
  if(callLock || callIsListening || callIsSpeaking) return;

  var SR=checkSpeechSupport();
  if(!SR) return;

  callLock=true;
  callFinalTranscript='';
  callEndFired=false;

  try{
    // 每次都新建实例（Chrome 规范：stop 后不可复用）
    callRecog=new SR();
    callRecog.lang='zh-CN';
    callRecog.continuous=true;          // 手动控制，不自动停止
    callRecog.interimResults=true;       // 实时显示中间结果
    callRecog.maxAlternatives=1;

    callRecog.onstart=function(){
      callIsListening=true;
      callLock=false;
      setCallUIState('listening');
      console.log('[电话] 录音开始');
    };

    // 累积最终结果
    callRecog.onresult=function(e){
      var interim='';
      var finalText='';
      for(var i=0;i<e.results.length;i++){
        var res=e.results[i];
        if(res.isFinal){
          finalText+=res[0].transcript;
        }else{
          interim+=res[0].transcript;
        }
      }
      if(finalText){
        callFinalTranscript+=(callFinalTranscript?' ':'')+finalText.trim();
      }
      // 实时显示正在说的话
      var display=callFinalTranscript+(interim?' '+interim:'');
      if(display){
        $('callStatus').textContent='🎤 '+display.slice(0,60);
      }
      console.log('[电话] 实时:',display);
    };

    callRecog.onend=function(){
      console.log('[电话] onend 触发，最终文本:',callFinalTranscript);
      callIsListening=false;
      callEndFired=true;
      callRecog=null;  // Chrome 要求 stop 后不能复用实例
      if(!callActive) return;
      // 如果是手动 stop() 触发的 onend，此时 callFinalTranscript 已有内容
      // 由 stopAndSend() 处理发送，这里只处理异常
      if(callActive && !callIsSpeaking && callMode==='listening'){
        // 意外结束（没调 stopAndSend）
        if(callFinalTranscript.trim()){
          // 有内容但没发送（极端情况），自动发送
          sendCallMessage(callFinalTranscript.trim());
        }else{
          setCallUIState('idle');
          showToast('没听到声音，请重试');
        }
      }
    };

    callRecog.onerror=function(e){
      var err=e.error||'';
      console.log('[电话] 识别错误:',err);
      callIsListening=false;
      callRecog=null;  // 清理实例引用
      if(err==='not-allowed'){
        showToast('⚠️ 请允许麦克风权限');
        setCallUIState('idle');
      }else if(e.error==='aborted'){
        // 手动 abort，正常流程，不报错
      }else if(callActive && !callIsSpeaking){
        setCallUIState('idle');
        showToast('识别出错: '+e.error);
      }
    };

    callRecog.start();
  }catch(err){
    console.log('[电话] 启动失败:',err.message);
    callLock=false;
    callIsListening=false;
    showToast('启动失败: '+err.message);
    setCallUIState('idle');
  }
}

function stopAndSend(){
  if(!callIsListening && !callRecog){
    var txt=callFinalTranscript.trim();
    if(txt) sendCallMessage(txt);
    return;
  }
  if(!callIsListening) return;

  var text=callFinalTranscript.trim();
  console.log('[电话] 手动停止，文本:',text);

  var rec=callRecog;
  callIsListening=false;

  try{
    rec.stop();
    console.log('[电话] stop() 已调用');
  }catch(e){
    console.log('[电话] stop() 出错:',e.message);
    try{rec.abort();}catch(ee){}
  }

  if(text){
    setCallUIState('processing');
    // 等待 onend 触发，超时保护 2 秒
    var waited=0;
    var checkTimer=setInterval(function(){
      waited+=100;
      if(callEndFired || waited>=2000){
        clearInterval(checkTimer);
        var finalText=callFinalTranscript.trim();
        console.log('[电话] 发送最终文本:',finalText);
        if(finalText){
          sendCallMessage(finalText);
        }else{
          setCallUIState('idle');
          showToast('没识别到内容');
        }
      }
    },100);
  }else{
    setCallUIState('idle');
    showToast('没听到内容，请重试');
  }
}

function stopCallRecog(){
  try{if(callRecog){callRecog.abort();}}catch(e){}
  callRecog=null;
  callIsListening=false;
  if(callActive) setCallUIState('idle');
}

function stopCallSpeak(){
  speechSynthesis.cancel();
  callIsSpeaking=false;
  if(callActive) setCallUIState('idle');
}

function sendCallMessage(text){
  if(!callActive) return;
  var c=chats[curId];if(!c) return;

  console.log('[电话] 发送消息:',text);

  // 切到思考状态
  setCallUIState('thinking');

  c.hist.push({role:'user',content:text});
  saveChats();

  // 聊天区显示用户说的话
  var div=document.createElement('div');
  div.className='msg user';
  div.innerHTML='<div class="bubble user">'+esc(text)+'</div><div class="msg-time">'+nowT()+'</div>';
  $('chat').appendChild(div);
  scrollBottom();

  fetch('https://api.llm7.io/v1/chat/completions',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:c.model||'default',stream:false,messages:buildMessages(c.hist)})
  })
  .then(function(r){
    if(!r.ok) throw new Error('网络错误 '+r.status);
    return r.json();
  })
  .then(function(d){
    if(!callActive) return;
    var content=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||'(无回复)';
    c.hist.push({role:'assistant',content:content});
    saveChats();

    var div=document.createElement('div');
    div.className='msg ai';
    div.innerHTML='<div class="bubble ai">'+esc(content)+'</div><div class="msg-time">'+nowT()+'</div>';
    $('chat').appendChild(div);
    scrollBottom();

    // 更新状态为 speaking 并朗读
    speakCallContent(content);
  })
  .catch(function(e){
    console.log('[电话] 发送失败:',e.message);
    if(!callActive) return;
    setCallUIState('idle');
    showToast('网络问题，请重试');
  });
}

function speakCallContent(text){
  if(!callActive || !('speechSynthesis' in window)) {
    setCallUIState('idle');
    return;
  }
  try{if(callRecog){callRecog.abort();}}catch(e){}
  setTimeout(function(){
    if(!callActive) return;
    callIsSpeaking=true;
    setCallUIState('speaking');
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text.slice(0,500));
    if(selectedVoice){
      var v=voices.find(function(x){return x.voiceURI===selectedVoice;});
      if(v) u.voice=v;
    }
    u.rate=1;u.pitch=1;u.volume=1;
    u.onend=function(){
      callIsSpeaking=false;
      if(callActive) setCallUIState('idle');
    };
    u.onerror=function(){
      callIsSpeaking=false;
      if(callActive) setCallUIState('idle');
    };
    speechSynthesis.speak(u);
  },300);
}

function endCallManually(){
  if(!callActive) return;
  callActive=false;
  try{if(callRecog){callRecog.abort();}}catch(e){}
  speechSynthesis.cancel();
  clearInterval(callTimerInterval);
  callIsListening=false;
  callIsSpeaking=false;
  callLock=false;

  var duration=callStartTime?Math.floor((Date.now()-callStartTime)/1000):0;
  if(duration>2){
    var div=document.createElement('div');
    div.className='msg ai';
    div.innerHTML='<div class="bubble ai">📞 [通话记录] 时长：'+duration+'秒</div><div class="msg-time">'+nowT()+'</div>';
    $('chat').appendChild(div);
    scrollBottom();
    saveChats();
  }
  setCallUIState('idle');
  $('callTimer').textContent='';
  callStartTime=null;
  showToast('📞 通话已结束');
  sidebarTab='chat';
  applyTabView();
}

function enterCallView(){
  if(callActive) return;
  callActive=true;
  callStartTime=Date.now();
  // 重置所有电话状态
  callIsListening=false;
  callIsSpeaking=false;
  callLock=false;
  callEndFired=false;
  callFinalTranscript='';
  setCallUIState('idle');
  $('callTimer').textContent='⏱ 00:00';

  clearInterval(callTimerInterval);
  callTimerInterval=setInterval(function(){
    if(!callActive) return;
    var sec=Math.floor((Date.now()-callStartTime)/1000);
    var m=Math.floor(sec/60),s=sec%60;
    $('callTimer').textContent='⏱ '+m+':'+(s<10?'0':'')+s;
  },1000);
  showToast('📞 通话已接通');
}

// ===== 工具 =====
function showToast(m){
  var t=$('toast');t.textContent=m;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2000);
}
function scrollBottom(){var m=$('chat');m.scrollTop=m.scrollHeight;}
function nowT(){var d=new Date();return (d.getHours()+'').padStart(2,'0')+':'+(d.getMinutes()+'').padStart(2,'0');}
function esc(s){var m={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};return s.replace(/[&<>"']/g,function(c){return m[c];});}

// ===== 启动 =====
init();
</script>
